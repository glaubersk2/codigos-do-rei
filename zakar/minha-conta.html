<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zakar | Meus Pedidos & Rastreamento</title>
  <meta name="description" content="Acompanhe o status e a entrega dos seus pedidos do jogo bíblico Zakar." />
  <meta name="theme-color" content="#250d3a" />
  <meta name="robots" content="noindex,nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --purple-950: #250d3a;
      --purple-900: #32104d;
      --purple-800: #451568;
      --purple-700: #5d2089;
      --purple-600: #7734a8;
      --purple-100: #f4ecfb;
      --yellow: #ffc53d;
      --orange: #f47a2a;
      --green: #4fae36;
      --green-dark: #1f9d55;
      --blue: #1b9ed8;
      --red: #ef4545;
      --ink: #20152b;
      --muted: #6d6275;
      --line: rgba(57, 21, 82, 0.10);
      --cream: #fff9ee;
      --cream-2: #fff1d6;
      --paper: #fffefa;
      --white: #ffffff;
      --shadow-sm: 0 8px 24px rgba(41, 16, 58, 0.08);
      --shadow-md: 0 20px 58px rgba(41, 16, 58, 0.14);
      --shadow-lg: 0 34px 90px rgba(37, 13, 58, 0.20);
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --max: 1080px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .announcement {
      background: var(--purple-950);
      color: #ffffff;
      padding: 8px 16px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .announcement span { color: #ffd86b; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 254, 250, 0.92);
      border-bottom: 1px solid rgba(57, 21, 82, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .header-inner {
      height: 72px;
      width: min(var(--max), calc(100% - 40px));
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-weight: 900;
      letter-spacing: -0.055em;
      font-size: 1.75rem;
      line-height: 1;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--yellow), #ff9f1f);
      display: grid;
      place-items: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 8px 20px rgba(244, 122, 42, 0.24);
      font-size: 1.2rem;
    }
    .brand-word span:nth-child(1) { color: #189cdc; }
    .brand-word span:nth-child(2) { color: #f6ba20; }
    .brand-word span:nth-child(3) { color: #4aa727; }
    .brand-word span:nth-child(4) { color: #f17b20; }
    .brand-word span:nth-child(5) { color: #ec3535; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: #f4ecfb;
      border: 1px solid rgba(93, 32, 137, 0.12);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 750;
      color: var(--purple-900);
    }
    .user-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--purple-700);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 0.72rem;
      font-weight: 900;
    }
    .btn-logout {
      border: 1px solid rgba(57, 21, 82, 0.16);
      background: #ffffff;
      color: #645472;
      padding: 7px 15px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-logout:hover {
      background: #fbf6ff;
      color: var(--red);
      border-color: rgba(239, 69, 69, 0.3);
    }

    main {
      flex: 1;
      padding: 40px 20px 80px;
      background:
        radial-gradient(circle at 10% 12%, rgba(255, 197, 61, 0.15), transparent 25%),
        radial-gradient(circle at 90% 88%, rgba(27, 158, 216, 0.10), transparent 25%),
        linear-gradient(180deg, #fffcf6 0%, #fff7ec 100%);
    }
    .container {
      width: min(var(--max), calc(100% - 40px));
      margin-inline: auto;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .page-head h1 {
      font-size: clamp(2rem, 3.8vw, 2.7rem);
      font-weight: 900;
      color: var(--purple-950);
      line-height: 1.1;
      letter-spacing: -0.04em;
      margin: 0 0 6px;
    }
    .page-head p {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }
    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: #ffffff;
      border: 1.5px solid rgba(57, 21, 82, 0.12);
      border-radius: 999px;
      color: var(--purple-800);
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .btn-refresh:hover {
      background: #faf5fe;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(57, 21, 82, 0.10);
    }

    /* Order Cards */
    .orders-grid {
      display: grid;
      gap: 24px;
    }

    .order-card {
      background: #ffffff;
      border: 1.5px solid rgba(57, 21, 82, 0.10);
      border-radius: var(--radius-lg);
      padding: 28px 30px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.25s ease;
    }
    .order-card:hover {
      box-shadow: var(--shadow-lg);
    }
    .order-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: linear-gradient(180deg, var(--purple-700), var(--orange));
    }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .order-id-meta h2 {
      margin: 0 0 4px;
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--purple-950);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .order-date {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .badge-pendente {
      background: #fff8e6;
      color: #b45309;
      border: 1px solid #fde68a;
    }
    .badge-pago {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }
    .badge-producao {
      background: #f5f3ff;
      color: #6d28d9;
      border: 1px solid #ddd6fe;
    }
    .badge-separando {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .badge-enviado {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .badge-entregue {
      background: #047857;
      color: #ffffff;
    }
    .badge-cancelado {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    /* Stepper / Timeline */
    .stepper-wrap {
      margin: 24px 0 20px;
    }
    .stepper {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      position: relative;
    }
    .step-item {
      text-align: center;
      position: relative;
    }
    .step-icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f1e8f7;
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      margin: 0 auto 8px;
      position: relative;
      z-index: 2;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 10px rgba(57, 21, 82, 0.08);
      transition: all 0.3s ease;
    }
    .step-item.active .step-icon-wrap {
      background: var(--purple-700);
      color: #ffffff;
      box-shadow: 0 0 0 4px rgba(93, 32, 137, 0.18);
    }
    .step-item.done .step-icon-wrap {
      background: var(--green-dark);
      color: #ffffff;
    }
    .step-label {
      font-size: 0.8rem;
      font-weight: 750;
      color: var(--muted);
      line-height: 1.2;
    }
    .step-item.active .step-label {
      color: var(--purple-950);
      font-weight: 850;
    }
    .step-item.done .step-label {
      color: var(--green-dark);
    }
    .step-bar {
      position: absolute;
      top: 20px;
      left: 10%;
      right: 10%;
      height: 3px;
      background: #e7dde8;
      z-index: 1;
    }
    .step-bar-fill {
      height: 100%;
      background: var(--green-dark);
      transition: width 0.4s ease;
    }

    /* Order Details Grid */
    .order-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      background: #faf6fd;
      border: 1px solid rgba(57, 21, 82, 0.06);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-top: 20px;
    }
    .detail-item small {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }
    .detail-item strong {
      font-size: 1.05rem;
      color: var(--purple-950);
      font-weight: 850;
    }

    /* Highlights & Actions */
    .info-boxes {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    .info-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 700;
      flex-wrap: wrap;
    }
    .info-banner.tracking {
      background: #eef8ff;
      border: 1px solid #bae6fd;
      color: #0369a1;
    }
    .info-banner.production {
      background: #fdf8e6;
      border: 1px solid #fde047;
      color: #854d0e;
    }
    .tracking-code-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid #bae6fd;
    }
    .btn-track {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0284c7;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      transition: all 0.2s ease;
    }
    .btn-track:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }

    .order-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .btn-whatsapp-order {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #1f9d55;
      font-weight: 800;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }
    .btn-whatsapp-order:hover {
      color: #15803d;
      text-decoration: underline;
    }

    /* Empty State */
    .empty-state {
      background: #ffffff;
      border: 1.5px dashed rgba(57, 21, 82, 0.18);
      border-radius: var(--radius-lg);
      padding: 60px 24px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .empty-icon {
      font-size: 3.5rem;
      margin-bottom: 14px;
      display: inline-block;
    }
    .empty-state h3 {
      font-size: 1.5rem;
      color: var(--purple-950);
      margin: 0 0 8px;
      font-weight: 900;
    }
    .empty-state p {
      color: var(--muted);
      max-width: 440px;
      margin: 0 auto 24px;
      font-size: 0.95rem;
    }
    .btn-buy-now {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 15px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--purple-800), var(--purple-600));
      color: #ffffff;
      font-weight: 900;
      font-size: 1rem;
      box-shadow: 0 12px 28px rgba(75, 22, 122, 0.24);
      transition: all 0.2s ease;
    }
    .btn-buy-now:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(75, 22, 122, 0.30);
    }

    /* Skeleton Loading */
    .skeleton-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 30px;
      box-shadow: var(--shadow-sm);
      display: grid;
      gap: 16px;
      animation: pulse 1.5s infinite;
    }
    .skeleton-line {
      height: 18px;
      background: #f1e8f7;
      border-radius: 8px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    footer {
      background: #1c0a29;
      color: #cbbdd2;
      padding: 30px 0;
      font-size: 0.86rem;
      margin-top: auto;
    }
    .footer-inner {
      width: min(var(--max), calc(100% - 40px));
      margin-inline: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .footer-inner strong { color: #ffffff; }
    .footer-links { display: flex; gap: 18px; flex-wrap: wrap; }
    .footer-links a:hover { color: #ffffff; }

    @media (max-width: 768px) {
      .announcement { font-size: 0.74rem; padding: 6px 12px; }
      .header-inner { height: 62px; width: calc(100% - 24px); }
      .brand { font-size: 1.4rem; gap: 8px; }
      .brand-mark { width: 32px; height: 32px; font-size: 1.05rem; }
      .user-pill { padding: 5px 10px; font-size: 0.78rem; max-width: 140px; }
      .user-pill span#user-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .btn-logout { padding: 5px 10px; font-size: 0.76rem; }
      main { padding: 22px 12px 60px; }
      .container { width: 100%; }
      .page-head { margin-bottom: 20px; gap: 12px; }
      .page-head h1 { font-size: 1.85rem; }
      .page-head p { font-size: 0.88rem; }
      .btn-refresh { width: 100%; justify-content: center; padding: 10px; font-size: 0.84rem; }

      .order-card { padding: 20px 16px; border-radius: 20px; }
      .order-card-header { padding-bottom: 14px; gap: 10px; flex-direction: column; align-items: flex-start; }
      .order-id-meta h2 { font-size: 1.25rem; }
      .order-date { font-size: 0.78rem; }
      .badge { font-size: 0.78rem; padding: 5px 12px; align-self: flex-start; }

      /* Stepper on Mobile: Horizontal scrollable track with clear pills */
      .stepper-wrap {
        margin: 18px 0 16px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 6px;
      }
      .stepper {
        display: flex;
        min-width: 440px;
        justify-content: space-between;
        position: relative;
        gap: 8px;
      }
      .step-item {
        flex: 1;
        min-width: 80px;
      }
      .step-icon-wrap {
        width: 36px;
        height: 36px;
        font-size: 0.95rem;
        margin-bottom: 6px;
      }
      .step-label {
        font-size: 0.74rem;
      }
      .step-bar {
        top: 18px;
        left: 8%;
        right: 8%;
        height: 2.5px;
      }

      .order-details-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 14px 14px;
        margin-top: 16px;
      }
      .detail-item:nth-child(3) {
        grid-column: 1 / -1;
        background: #f1e6fa;
        padding: 10px 12px;
        border-radius: 10px;
      }
      .detail-item small { font-size: 0.72rem; }
      .detail-item strong { font-size: 0.98rem; }

      .info-boxes { gap: 10px; margin-top: 14px; }
      .info-banner { padding: 12px 14px; font-size: 0.82rem; flex-direction: column; align-items: flex-start; gap: 10px; }
      .info-banner .btn-track { width: 100%; justify-content: center; }
      .tracking-code-wrap { width: 100%; justify-content: space-between; }

      .order-card-footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        margin-top: 16px;
        padding-top: 14px;
      }
      .btn-whatsapp-order {
        width: 100%;
        justify-content: center;
        padding: 10px;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="announcement">
    Mais do que um jogo: <span>uma experiência de fé, aprendizado e conexão.</span>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/zakar/" aria-label="Zakar, início">
        <span class="brand-mark" aria-hidden="true">🦁</span>
        <span class="brand-word"><span>Z</span><span>A</span><span>K</span><span>A</span><span>R</span></span>
      </a>

      <div class="header-actions">
        <div class="user-pill" id="user-display">

        <button type="button" class="btn-logout" id="btn-sair" title="Sair da conta">Sair</button>
      </div>

  </header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Meus Pedidos</h1>

        <button type="button" class="btn-refresh" id="btn-recarregar">

      <!-- Orders List Container -->
      <div id="pedidos-container">
        <!-- Skeleton Loading initial -->
        <div class="skeleton-card">
          <div class="skeleton-line" style="width: 40%"></div>
          <div class="skeleton-line" style="width: 70%"></div>
          <div class="skeleton-line" style="width: 50%"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div>
        <strong>Associação Códigos do Rei</strong><br />
        Transformando vidas através da cultura e da fé.
      </div>
      <div class="footer-links">
        <a href="/zakar/">Página Inicial Zakar</a>
        <a href="https://instagram.com/codigosdorei" target="_blank" rel="noopener">@codigosdorei</a>
        <a href="https://wa.me/5521965943516" target="_blank" rel="noopener">WhatsApp: (21) 96594-3516</a>
      </div>
    </div>
  </footer>

  <script>
    const WORKER_URL = "https://loja-jogos-checkout.sistemas-glauber.workers.dev";

    const statusConfig = {
      pendente: {
        label: "Aguardando Pagamento",
        badgeClass: "badge-pendente",
        stepIndex: 0,
        desc: "Seu pedido foi registrado e está aguardando a confirmação do pagamento pelo PagBank.",
      },
      pago_em_estoque: {
        label: "Pago — Separando no Estoque",

      pago_em_producao: {

      },
      pronto_separando: {

      enviado: {

      },
      entregue: {
        label: "Entregue",
        badgeClass: "badge-entregue",
        stepIndex: 4,
        desc: "Pedido entregue com sucesso. Esperamos que aproveitem cada momento em família!",
      },
      cancelado: {
        label: "Cancelado",
        badgeClass: "badge-cancelado",
        stepIndex: -1,
        desc: "Este pedido foi cancelado.",
      },
    };

    function formatarReais(centavos) {
      return (centavos / 100).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL",
      });
    }

    function formatarData(dataIso) {
      if (!dataIso) return "";
      try {
        const d = new Date(dataIso);
        return d.toLocaleDateString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      } catch (e) {
        return dataIso;
      }
    }

    function copiarTexto(texto, btnEl) {
      navigator.clipboard.writeText(texto).then(() => {
        const original = btnEl.innerHTML;
        btnEl.innerHTML = "✓ Copiado!";
        setTimeout(() => {
          btnEl.innerHTML = original;
        }, 2000);
      });
    }

    function renderStepper(status) {
      const cfg = statusConfig[status] || statusConfig.pendente;
      const stepIdx = cfg.stepIndex;

      if (status === "cancelado") {
        return `<div style="color: var(--red); font-weight: 700; margin: 12px 0;">Pedido cancelado</div>`;
      }

      const steps = [
        { label: "Pedido Criado", icon: "📝" },
        { label: "Pagamento", icon: "💳" },
        { label: "Separação", icon: "📦" },
        { label: "Enviado", icon: "🚚" },
        { label: "Entregue", icon: "🎁" },
      ];

      const fillPercent = Math.min(100, (stepIdx / (steps.length - 1)) * 100);

      const stepsHtml = steps.map((s, idx) => {
        let stateClass = "";
        if (idx < stepIdx) stateClass = "done";
        else if (idx === stepIdx) stateClass = "active";

        return `
          <div class="step-item ${stateClass}">
            <div class="step-icon-wrap">${idx < stepIdx ? "✓" : s.icon}</div>
            <div class="step-label">${s.label}</div>
          </div>
        `;
      }).join("");

      return `
        <div class="stepper-wrap">
          <div class="stepper">
            <div class="step-bar">
              <div class="step-bar-fill" style="width: ${fillPercent}%;"></div>
            </div>
            ${stepsHtml}
          </div>
        </div>
      `;
    }

    async function carregarPedidos() {
      const token = localStorage.getItem("token_cliente");
      const nome = localStorage.getItem("nome_cliente") || "Cliente";

      if (!token) {
        window.location.href = "login.html";
        return;
      }

      document.getElementById("user-name").textContent = nome;
      document.getElementById("user-initial").textContent = nome.charAt(0).toUpperCase();

      const container = document.getElementById("pedidos-container");

      try {
        const resp = await fetch(`${WORKER_URL}/meus-pedidos`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        const dados = await resp.json();

        if (resp.status === 401) {
          localStorage.removeItem("token_cliente");
          localStorage.removeItem("nome_cliente");
          window.location.href = "login.html";
          return;
        }

        if (!resp.ok) throw new Error(dados.erro || "Erro ao consultar pedidos.");

        if (!dados.pedidos || dados.pedidos.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <span class="empty-icon">🦁</span>
              <h3>Nenhum pedido encontrado</h3>
              <p>Você ainda não realizou compras com este cadastro ou seus pedidos estão sendo processados.</p>
              <a href="/zakar/#oferta" class="btn-buy-now">Adquirir o Jogo Zakar →</a>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="orders-grid">
            ${dados.pedidos.map(pedido => {
              const cfg = statusConfig[pedido.status] || {
                label: pedido.status,
                badgeClass: "badge-pendente",
                desc: "",
              };

              const previsaoHtml = pedido.data_prevista_pronto ? `
                <div class="info-banner production">
                  <div>
                    📅 <strong>Previsão de conclusão da produção:</strong> ${new Date(pedido.data_prevista_pronto).toLocaleDateString('pt-BR')}
                  </div>
                </div>
              ` : "";

              const rastreioHtml = pedido.codigo_rastreio ? `
                <div class="info-banner tracking">
                  <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <span>📦 <strong>Código de Rastreio:</strong></span>
                    <span class="tracking-code-wrap">
                      <code>${pedido.codigo_rastreio}</code>
                      <button type="button" style="background:transparent;border:0;cursor:pointer;font-size:0.8rem;color:#0284c7;font-weight:700;" onclick="copiarTexto('${pedido.codigo_rastreio}', this)">Copiar</button>
                    </span>
                  </div>
                  <a href="https://rastreamento.correios.com.br/app/index.php?codigo=${pedido.codigo_rastreio}" target="_blank" rel="noopener" class="btn-track">
                    Rastrear nos Correios ↗
                  </a>
                </div>
              ` : "";

              return `
                <article class="order-card">
                  <div class="order-card-header">
                    <div class="order-id-meta">
                      <h2>Pedido #${pedido.id}</h2>
                      <span class="order-date">Realizado em ${formatarData(pedido.criado_em)}</span>
                    </div>
                    <div>
                      <span class="badge ${cfg.badgeClass}">${cfg.label}</span>
                    </div>
                  </div>

                  ${renderStepper(pedido.status)}

                  <div class="info-boxes">
                    ${previsaoHtml}
                    ${rastreioHtml}
                  </div>

                  <div class="order-details-grid">
                    <div class="detail-item">
                      <small>Item Adquirido</small>
                      <strong>Jogo Bíblico Zakar</strong>
                    </div>
                    <div class="detail-item">
                      <small>Quantidade</small>
                      <strong>${pedido.quantidade} ${pedido.quantidade > 1 ? 'unidades' : 'unidade'}</strong>
                    </div>
                    <div class="detail-item">
                      <small>Valor Total</small>
                      <strong style="color: var(--purple-800);">${formatarReais(pedido.total_centavos)}</strong>
                    </div>
                  </div>

                  <div class="order-card-footer">
                    <div style="font-size: 0.84rem; color: var(--muted);">
                      ${cfg.desc}
                    </div>
                    <a href="https://wa.me/5521965943516?text=Ol%C3%A1%21%20Gostaria%20de%20informa%C3%A7%C3%B5es%20sobre%20o%20meu%20pedido%20%23${pedido.id}%20do%20jogo%20Zakar." target="_blank" rel="noopener" class="btn-whatsapp-order">
                      💬 Precisa de ajuda com este pedido?
                    </a>
                  </div>
                </article>
              `;
            }).join("")}
          </div>
        `;
      } catch (err) {
        container.innerHTML = `
          <div class="empty-state" style="border-color: var(--red);">
            <span class="empty-icon">⚠️</span>
            <h3>Não foi possível carregar seus pedidos</h3>
            <p>${err.message}</p>
            <button type="button" class="btn-buy-now" onclick="carregarPedidos()">Tentar Novamente</button>
          </div>
        `;
      }
    }

    document.getElementById("btn-sair").addEventListener("click", () => {
      localStorage.removeItem("token_cliente");
      localStorage.removeItem("nome_cliente");
      window.location.href = "login.html";
    });

    document.getElementById("btn-recarregar").addEventListener("click", () => {
      carregarPedidos();
    });

    carregarPedidos();
  </script>
</body>
</html>
